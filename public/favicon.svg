<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#1D4ED8" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1D4ED8" flood-opacity="0.3"/>
        </filter>
    </defs>
    <!-- Rounded Background Box -->
    <rect width="64" height="64" rx="16" fill="url(#blueGradient)" filter="url(#shadow)"/>
    
    <!-- Modern POS Terminal / Register Screen Mark -->
    <rect x="15" y="14" width="34" height="24" rx="4" fill="white" fill-opacity="0.95"/>
    <rect x="19" y="18" width="26" height="16" rx="2.5" fill="#1D4ED8" fill-opacity="0.12"/>
    
    <!-- Stylized Receipt / Card Slot -->
    <path d="M23 23H41" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M23 28H35" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Stand Base -->
    <path d="M26 38L22 49H42L38 38" fill="white" fill-opacity="0.95"/>
    <rect x="17" y="48" width="30" height="3.5" rx="1.75" fill="white"/>
</svg>

